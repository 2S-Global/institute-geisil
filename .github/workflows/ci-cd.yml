name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build React Vite App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222

          script: |
            set -e

            cd /var/www/services.geisil.com

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building Vite app..."
            npm run build

            echo "Copying build to Nginx..."
            sudo rm -rf /var/www/services.geisil.com*
            sudo cp -r dist/* /var/www/services.geisil.com

            echo "Deployment completed successfully!"
